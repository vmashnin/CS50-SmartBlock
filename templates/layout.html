<!DOCTYPE html>

<html lang="en">
    <head>
        <title>SmartBlock</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>

    <body>

        <nav>
            <a class="btn btn-primary" href="/">Main</a>
            <a class="btn btn-primary" href="/history">History</a>
            <a class="btn btn-primary" href="/settings">Change Password</a>

            {% if is_admin %}
                <a class="btn btn-primary" href="/admin">Admin</a>
            {% endif %}

            <a class="btn btn-primary" href="/logout">Log Out</a>
        </nav>

        <main>
            {% block main %}{% endblock %}
        </main>

    </body>
</html>
